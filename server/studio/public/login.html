<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>BroadRoads Studio</title>
  <link rel="stylesheet" href="/studio.css">
  <script src="/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand"><span class="brand-mark">BR</span><div><b>BroadRoads</b><span>Studio</span></div></div>
    <h1>Admins only</h1>
    <p class="muted">Sign in with the studio admin token.</p>
    <form id="login" autocomplete="off">
      <label for="token">Admin token</label>
      <input id="token" name="token" type="password" required minlength="16" autocomplete="current-password" autofocus>
      <button class="btn primary" type="submit">Sign in</button>
      <p id="err" class="error" role="alert" hidden></p>
    </form>
  </main>
</body>
</html>
