<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BroadRoads Dev Console</title>
<link rel="stylesheet" href="/login.css">
</head>
<body>
<main>
  <form method="post" action="/login" autocomplete="off">
    <h1>BroadRoads <span>Dev Console</span></h1>
    <p class="muted">Restricted. Every sign-in attempt is logged.</p>
    <!--msg-->
    <label for="token">Access token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" required autofocus maxlength="512">
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
