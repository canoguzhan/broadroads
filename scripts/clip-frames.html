<!doctype html>
<!-- Frame strip of one animation clip, for picking trim windows (scripts/clip-frames.mjs). -->
<html><body style="margin:0;background:#20262c">

<script type="module">

import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
